spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ddd-order-boundary
  datasource:
    url: jdbc:h2:file:./data/devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      jakarta.persistence.create-database-schemas: true  # 컨텍스트별 스키마(orders, product)를 테이블보다 먼저 만든다
  h2:
    console:
      enabled: true
      path: /h2-console
order:
  reservation:
    expire-time: 10            # 결제 마감까지 (분)
    expire-check-interval: 30  # 만료 스케줄러 주기 (초)
