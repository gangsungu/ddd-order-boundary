spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ddd-order-boundary
  datasource:
    url: jdbc:h2:file:./data/devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
order:
  reservation:
    expire-time: 10
